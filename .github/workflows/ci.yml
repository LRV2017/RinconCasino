name: Rincon Casino checks
on:
  push:
    branches: ["main", "mega-casino-rebuild", "genuine-game-expansion"]
  pull_request:
    branches: ["main"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
