name: Rogueboard syntax check

on:
  push:
    branches: [main]
    paths:
      - "illegal-chess/**"
      - ".github/workflows/rogueboard-check.yml"
  pull_request:
    paths:
      - "illegal-chess/**"
      - ".github/workflows/rogueboard-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check illegal-chess/app.js
