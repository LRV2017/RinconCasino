name: Rogueboard syntax check

on:
  push:
    branches: [main]
    paths:
      - "illegal-chess/**"
      - ".github/workflows/rogueboard-check.yml"
  pull_request:
    paths:
      - "illegal-chess/**"
      - ".github/workflows/rogueboard-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check illegal-chess/app.js
          node --check illegal-chess/power-bank.js
          node --check illegal-chess/peer-room.js
      - name: Verify power catalogue size and uniqueness
        run: |
          node --input-type=module -e "import('./illegal-chess/power-bank.js').then(({POWER_CATALOG, POWER_COUNT}) => { const ids = new Set(POWER_CATALOG.map(power => power.id)); if (POWER_COUNT !== 1000 || ids.size !== 1000) throw new Error('Expected exactly 1,000 unique powers'); console.log('Verified ' + POWER_COUNT + ' unique powers.'); })"
