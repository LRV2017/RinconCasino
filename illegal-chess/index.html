<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d0e">
  <meta name="description" content="Rogueboard — a rule-breaking chess arena. Play chaotic chess, unleash abilities, and climb the local ladder.">
  <title>ROGUEBOARD — Chess, Unchained</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d8ff3f'/%3E%3Cpath d='M18 48V16h19c9 0 14 5 14 13 0 6-3 10-9 12l11 7H39l-9-6h-1v6zM29 29h8c2 0 3-1 3-3s-1-3-3-3h-8z' fill='%23090d0e'/%3E%3C/svg%3E">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-view="home" aria-label="Rogueboard home">
        <span class="brand-mark">R</span>
        <span class="brand-copy"><strong>ROGUE<span>BOARD</span></strong><small>CHESS / UNCHAINED</small></span>
      </a>
      <div class="side-label">THE ARENA</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><span>Overview</span><kbd>01</kbd></button>
        <button class="nav-item" data-view="play"><span class="nav-icon">♟</span><span>Play</span><kbd>02</kbd></button>
        <button class="nav-item" data-view="practice"><span class="nav-icon">⌘</span><span>Training lab</span><kbd>03</kbd></button>
        <button class="nav-item" data-view="armory"><span class="nav-icon">✳</span><span>Armory</span><kbd>04</kbd></button>
        <button class="nav-item" data-view="quests"><span class="nav-icon">◈</span><span>Challenges</span><kbd>05</kbd></button>
        <button class="nav-item" data-view="rank"><span class="nav-icon">↗</span><span>Season rank</span><kbd>06</kbd></button>
        <button class="nav-item" data-view="account"><span class="nav-icon">◎</span><span>Account & saves</span><kbd>07</kbd></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="season-card">
        <div class="season-orbit"><span>01</span></div>
        <div><small>LIVE SEASON</small><strong>THE UNWRITTEN</strong><p>Every rule is optional.</p></div>
        <div class="season-progress"><i></i></div>
        <div class="season-foot"><span>SEASON 01</span><span>ENDS IN 18D</span></div>
      </div>
      <button class="profile-mini" data-view="profile">
        <span class="avatar">R</span>
        <span class="profile-mini-copy"><strong id="side-name">ROOKIE</strong><small id="side-rank">UNRANKED · LVL 1</small></span>
        <span class="profile-more">···</span>
      </button>
      <div class="sidebar-bottom"><span class="status-dot" id="save-status-dot"></span><span id="save-status">LOCAL PROFILE SAVED</span><span class="build-tag">V0.2</span></div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left"><button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button><span class="top-kicker">SEASON 01</span><span class="top-slash">/</span><strong id="top-section">THE ARENA</strong></div>
        <div class="topbar-right">
          <div class="currency-pill"><span class="coin-icon">◈</span><strong id="top-coins">450</strong><small>SHARDS</small></div>
          <button class="top-avatar" data-view="profile" id="top-avatar">R</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1">
        <div class="loading-state"><div class="loading-mark">R</div><p>SETTING UP THE BOARD...</p></div>
      </main>
      <footer class="footer"><span>ROGUEBOARD © 2026</span><span>BUILT FOR THE BEAUTIFUL ART OF CHEATING.</span><span>V0.1.0 / EARLY ACCESS</span></footer>
    </div>
  </div>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
